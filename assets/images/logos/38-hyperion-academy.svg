<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B111A"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Open Tech Knowledge Prism / Neural Book -->
                <polygon points="0,-55 48,-25 0,5 -48,-25" fill="url(#grad)"/>
                <polygon points="0,5 48,-25 48,25 0,55" fill="#6366F1"/>
                <polygon points="0,5 -48,-25 -48,25 0,55" fill="#38BDF8"/>
                <circle cx="0" cy="5" r="7" fill="#FFFFFF"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="system-ui, sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="7px" 
          fill="#FFFFFF">
      HYPERION ACADEMY
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#818CF8" 
          opacity="0.9">
      MENTORIA & FORMAÇÃO PRÁTICA EM I.A.
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      TECNOLOGIA & SAAS
    </text>
  </g>
</svg>