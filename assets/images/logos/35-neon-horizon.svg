<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0D0714"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- 80s Retrowave Segmented Sun & Horizon -->
                <circle cx="0" cy="0" r="50" fill="url(#grad)"/>
                <line x1="-50" y1="-5" x2="50" y2="-5" stroke="#0D0714" stroke-width="5"/>
                <line x1="-50" y1="10" x2="50" y2="10" stroke="#0D0714" stroke-width="6"/>
                <line x1="-50" y1="25" x2="50" y2="25" stroke="#0D0714" stroke-width="8"/>
                <polygon points="-55,42 0,15 55,42" fill="#38BDF8"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Impact', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="7px" 
          fill="#FFFFFF">
      NEON HORIZON
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#38BDF8" 
          opacity="0.9">
      SYNTHWAVE MUSIC & RECORD LABEL
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      CRIATIVIDADE & MÍDIA
    </text>
  </g>
</svg>