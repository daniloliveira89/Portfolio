<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FDE047" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0D0C0A"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Golden Sculpted Mask Silhouette -->
                <path d="M0,-55 C35,-55 45,-15 35,25 C25,55 0,55 0,55 C0,55 -25,55 -35,25 C-45,-15 -35,-55 0,-55 Z" fill="url(#grad)"/>
                <ellipse cx="-14" cy="-8" rx="8" ry="4" fill="#0D0C0A"/>
                <ellipse cx="14" cy="-8" rx="8" ry="4" fill="#0D0C0A"/>
                <line x1="0" y1="-5" x2="0" y2="18" stroke="#0D0C0A" stroke-width="3"/>
                <line x1="-10" y1="30" x2="10" y2="30" stroke="#0D0C0A" stroke-width="3"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Playfair Display', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="10px" 
          fill="#FFFFFF">
      AUREA ATELIER
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#FEF08A" 
          opacity="0.9">
      GOLD MASK & SURREAL ART DIRECTION
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      CRIATIVIDADE & MÍDIA
    </text>
  </g>
</svg>