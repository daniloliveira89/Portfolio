<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#12110D"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Sun + Solar Cell Grid Shield -->
                <circle cx="0" cy="0" r="30" fill="url(#grad)"/>
                <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                    <line x1="0" y1="-50" x2="0" y2="-38"/>
                    <line x1="0" y1="38" x2="0" y2="50"/>
                    <line x1="-50" y1="0" x2="-38" y2="0"/>
                    <line x1="38" y1="0" x2="50" y2="0"/>
                    <line x1="-35" y1="-35" x2="-26" y2="-26"/>
                    <line x1="26" y1="26" x2="35" y2="35"/>
                    <line x1="35" y1="-35" x2="26" y2="-26"/>
                    <line x1="-26" y1="26" x2="-35" y2="35"/>
                </g>
                <line x1="-18" y1="0" x2="18" y2="0" stroke="#000000" stroke-width="3"/>
                <line x1="0" y1="-18" x2="0" y2="18" stroke="#000000" stroke-width="3"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="system-ui, sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="7px" 
          fill="#FFFFFF">
      SOLARIS ENERGIA
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#FDE047" 
          opacity="0.9">
      USINAS SOLARES & ENGENHARIA FOTOVOLTAICA
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      IMOBILIÁRIO & ENGENHARIA
    </text>
  </g>
</svg>