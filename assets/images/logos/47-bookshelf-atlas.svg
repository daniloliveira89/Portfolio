<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#120E0D"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Open Book & Bookmark Ribbon -->
                <path d="M0,35 C-25,20 -50,25 -50,25 L-50,-35 C-50,-35 -25,-40 0,-25 C25,-40 50,-35 50,-35 L50,25 C50,25 25,20 0,35 Z" fill="none" stroke="url(#grad)" stroke-width="5"/>
                <line x1="0" y1="-25" x2="0" y2="45" stroke="#FFFFFF" stroke-width="4"/>
                <polygon points="0,5 12,20 0,15" fill="url(#grad)"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Cormorant Garamond', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="8px" 
          fill="#FFFFFF">
      BOOKSHELF ATLAS
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#FDE68A" 
          opacity="0.9">
      PERSONAL LITERARY ARCHIVE & READING DIARY
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      APLICAÇÕES & GAMES
    </text>
  </g>
</svg>