<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9C8"/>
      <stop offset="100%" stop-color="#C2B29A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E2D9C8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E2D9C8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E2D9C8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#121415"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Scandinavian Geometric Woodgrain / Chair Form -->
                <circle cx="0" cy="0" r="68" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.6"/>
                <path d="M-40,30 L0,-45 L40,30 Z" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linejoin="round"/>
                <line x1="-30" y1="12" x2="30" y2="12" stroke="url(#grad)" stroke-width="3.5"/>
                <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Georgia', 'Cormorant Garamond', serif" 
          font-size="34" 
          font-weight="600" 
          letter-spacing="9px" 
          fill="#FFFFFF">
      NORDEN ATELIER
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#D4C5B0" 
          opacity="0.9">
      NORDIC WOOD & BESPOKE FURNITURE
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      E-COMMERCE & MODA
    </text>
  </g>
</svg>