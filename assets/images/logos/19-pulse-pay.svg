<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#09090E"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Continuous Liquid Wave Infinity Ring -->
                <circle cx="0" cy="0" r="55" fill="none" stroke="url(#grad)" stroke-width="6"/>
                <path d="M-35,0 Q-15,-30 0,0 T35,0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
                <circle cx="-15" cy="-8" r="5" fill="#22D3EE"/>
                <circle cx="15" cy="8" r="5" fill="#D946EF"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="system-ui, sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="8px" 
          fill="#FFFFFF">
      PULSE PAY
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#22D3EE" 
          opacity="0.9">
      GLOBAL CURRENCY & LIQUID FINTECH
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      JURÍDICO & FINANÇAS
    </text>
  </g>
</svg>