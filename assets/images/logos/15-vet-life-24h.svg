<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2DD4BF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0D171A"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Heart + ECG Pulse + Paw in Center -->
                <path d="M0,45 C-55,10 -55,-35 0,-25 C55,-35 55,10 0,45 Z" fill="none" stroke="url(#grad)" stroke-width="5"/>
                <path d="M-40,5 L-15,5 L-5,-15 L5,20 L15,5 L40,5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="0" cy="-35" r="6" fill="url(#grad)"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Segoe UI', sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="6px" 
          fill="#FFFFFF">
      VET LIFE 24H
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#5EEAD4" 
          opacity="0.9">
      HOSPITAL VETERINÁRIO & EMERGÊNCIA
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      SAÚDE & ESTÉTICA
    </text>
  </g>
</svg>