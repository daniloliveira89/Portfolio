<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0D1115"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Symbol -->
  <g filter="url(#shadow)">
    
            <g transform="translate(400, 220)">
                <!-- Industrial Gear & Caliper Crosshair -->
                <circle cx="0" cy="0" r="45" fill="none" stroke="url(#grad)" stroke-width="8"/>
                <line x1="-60" y1="0" x2="60" y2="0" stroke="#FFFFFF" stroke-width="4"/>
                <line x1="0" y1="-60" x2="0" y2="60" stroke="#FFFFFF" stroke-width="4"/>
                <circle cx="0" cy="0" r="16" fill="url(#grad)"/>
                <circle cx="0" cy="0" r="6" fill="#0D1115"/>
            </g>
        
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle">
    <!-- Logotype -->
    <text x="400" y="380" 
          font-family="'Courier New', monospace" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="7px" 
          fill="#FFFFFF">
      PRECISION CNC
    </text>

    <!-- Tagline -->
    <text x="400" y="420" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4px" 
          fill="#CBD5E1" 
          opacity="0.9">
      USINAGEM DE PRECISÃO & CALDEIRARIA PESADA
    </text>

    <!-- Category Pill -->
    <rect x="310" y="465" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="400" y="482" 
          font-family="system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="2px" 
          fill="#94A3B8">
      AUTOMOTIVO & INDÚSTRIA
    </text>
  </g>
</svg>