<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle inner radial ambient light -->
  <circle cx="32" cy="32" r="24" fill="#3B82F6" opacity="0.12" />

  <!-- Monogram DO -->
  <text x="32" y="41" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', serif" 
        font-size="26" 
        font-weight="900" 
        letter-spacing="-1px"
        text-anchor="middle" 
        fill="#FFFFFF"
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">DO</text>

  <!-- Status Pulse Dot -->
  <circle cx="49" cy="49" r="5" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="49" cy="49" r="3.5" fill="#60A5FA" />
  <circle cx="49" cy="49" r="1.5" fill="#FFFFFF" />
</svg>