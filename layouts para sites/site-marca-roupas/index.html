<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOCTURNE ATELIER — Heavyweight Streetwear & Alfaiataria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #F4F3EF; color: #111111; font-family: 'Inter', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="min-h-screen antialiased">
  <header class="border-b border-black/10 bg-[#F4F3EF]/90 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="font-brand text-xl tracking-tighter">NOCTURNE ATELIER®</span>
      <span class="text-xs uppercase tracking-widest text-neutral-500">Algodão Egípcio 420 GSM • Drop 04</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
    <div class="lg:col-span-7 grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded-2xl border border-black/10">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80" class="w-full h-72 object-cover rounded-xl">
        <h3 class="font-bold mt-3">Hoodie Boxy Heavy 480g</h3>
        <p class="text-sm text-neutral-500">R$ 580,00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-black/10">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80" class="w-full h-72 object-cover rounded-xl">
        <h3 class="font-bold mt-3">T-Shirt Oversized Pima</h3>
        <p class="text-sm text-neutral-500">R$ 290,00</p>
      </div>
    </div>

    <!-- Provador Virtual de Tamanho -->
    <div class="lg:col-span-5 bg-neutral-900 text-white p-8 rounded-3xl">
      <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Fit Finder Inteligente</span>
      <h2 class="font-brand text-3xl mt-1 mb-4">Descubra seu Tamanho Ideal</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-neutral-400 block mb-1">Sua Altura (cm)</label>
          <input id="fit-h" type="number" value="178" class="w-full px-3 py-2.5 bg-black border border-white/15 rounded-xl text-white font-bold">
        </div>
        <div>
          <label class="text-xs text-neutral-400 block mb-1">Seu Peso (kg)</label>
          <input id="fit-w" type="number" value="76" class="w-full px-3 py-2.5 bg-black border border-white/15 rounded-xl text-white font-bold">
        </div>
      </div>
      <div class="mt-6 p-4 rounded-2xl bg-white/10 border border-white/15 text-center">
        <span class="text-xs text-neutral-300 block">Recomendação de Modelagem Boxy:</span>
        <strong id="fit-res" class="font-brand text-3xl text-emerald-400 mt-1 block">Tamanho G (Large)</strong>
      </div>
    </div>
  </main>

  <script>
    const fh = document.getElementById('fit-h'), fw = document.getElementById('fit-w');
    function calcFit() {
      const h = Number(fh.value) || 175, w = Number(fw.value) || 75;
      let size = "Tamanho M (Medium)";
      if (w < 66 && h < 172) size = "Tamanho P (Small)";
      else if (w > 88 || h > 186) size = "Tamanho GG (X-Large)";
      else if (w > 75 || h > 177) size = "Tamanho G (Large)";
      document.getElementById('fit-res').textContent = size;
    }
    fh.addEventListener('input', calcFit); fw.addEventListener('input', calcFit);
  </script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
