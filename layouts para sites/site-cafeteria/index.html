<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TORRA 04 — Microtorrefação & Cafés Especiais</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #F3ECE2; color: #261C15; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-coffee { font-family: 'Fraunces', serif; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="min-h-screen antialiased">
  <header class="border-b border-stone-900/10 bg-[#F3ECE2]/90 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <span class="font-coffee text-2xl">TORRA 04 ☕</span>
      <span class="text-xs uppercase tracking-widest text-amber-900 font-semibold">Microlotes 88+ Pontos SCA • Pães de Fermentação Natural</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-14 grid grid-cols-1 lg:grid-cols-12 gap-12">
    <div class="lg:col-span-7">
      <span class="text-xs uppercase tracking-widest text-amber-800 font-bold">Torrado toda terça-feira</span>
      <h1 class="font-coffee text-5xl sm:text-6xl mt-2 leading-none">Do produtor da Mantiqueira para a sua xícara.</h1>

      <div class="flex gap-2 mt-8 mb-6">
        <button onclick="renderCoffee('filtrados')" class="px-4 py-2 rounded-full text-xs font-bold bg-[#261C15] text-white">Filtrados (V60 / Chemex)</button>
        <button onclick="renderCoffee('espresso')" class="px-4 py-2 rounded-full text-xs font-bold bg-white text-[#261C15]">Espresso Bar</button>
        <button onclick="renderCoffee('brunch')" class="px-4 py-2 rounded-full text-xs font-bold bg-white text-[#261C15]">Viennoiserie & Brunch</button>
      </div>

      <div id="coffee-menu" class="space-y-4"></div>
    </div>

    <div class="lg:col-span-5">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80" class="w-full h-96 object-cover rounded-3xl shadow-lg" alt="Specialty Coffee">
    </div>
  </main>

  <script>
    const COFFEE_MENU = {
      filtrados: [
        { name: "Geisha Lavado (Serra da Mantiqueira)", notes: "Notas de jasmim, bergamota e mel • 89 pts", price: "R$ 26" },
        { name: "Catuaí Vermelho Fermentação Anaeróbica", notes: "Frutas amarelas maduras e licor de cacau • 88 pts", price: "R$ 22" }
      ],
      espresso: [
        { name: "Flat White Duplo Ristretto", notes: "Leite vaporizado a 62°C em microespuma aveludada", price: "R$ 18" },
        { name: "Espresso Tonic Artesanal", notes: "Duplo espresso frutado, água tônica botânica e casca de laranja Bahia", price: "R$ 24" }
      ],
      brunch: [
        { name: "Croissant Folhado c/ Manteiga Francesa Isigny", notes: "72 horas de fermentação lenta e crosta caramelizada", price: "R$ 21" },
        { name: "Toast Sourdough & Ovos Caipiras Pochê", notes: "Abacate grelhado, queijo de cabra e dukkah da casa", price: "R$ 44" }
      ]
    };
    window.renderCoffee = function(cat) {
      document.getElementById('coffee-menu').innerHTML = COFFEE_MENU[cat].map(i => `
        <div class="bg-white p-5 rounded-2xl border border-stone-900/10 flex justify-between items-center">
          <div><h3 class="font-coffee text-xl">${i.name}</h3><p class="text-xs text-stone-500 mt-1">${i.notes}</p></div>
          <strong class="text-base font-bold text-amber-900">${i.price}</strong>
        </div>
      `).join('');
    };
    renderCoffee('filtrados');
  </script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
