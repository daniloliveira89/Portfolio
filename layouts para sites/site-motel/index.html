<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECLIPSE SUITES — Motel Boutique 5 Estrelas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #09060A; color: #F8F5FA; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-motel { font-family: 'Playfair Display', serif; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="min-h-screen antialiased">
  <header class="border-b border-rose-500/20 px-6 h-20 flex items-center justify-between max-w-6xl mx-auto">
    <span class="font-serif-motel text-2xl tracking-wider text-rose-400">ECLIPSE SUITES</span>
    <span class="text-xs uppercase tracking-widest text-zinc-400">Check-in 100% Digital • Cozinha 24h por Chef</span>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
      <div>
        <span class="text-xs uppercase tracking-widest text-rose-400 font-bold">Privacidade Absoluta & Arquitetura Sensorial</span>
        <h1 class="font-serif-motel text-4xl sm:text-6xl mt-2">Suítes com piscina aquecida e teto solar.</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="setPeriodo('4h')" class="px-4 py-2 rounded-full text-xs font-bold bg-rose-500 text-white">Período 4h</button>
        <button onclick="setPeriodo('pernoite')" class="px-4 py-2 rounded-full text-xs font-bold bg-white/10 text-white">Pernoite 12h (c/ Café)</button>
      </div>
    </div>

    <div id="suites-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
  </main>

  <script>
    const SUITES = [
      { name: "Penthouse Eclipse (Piscina Aquecida & Teto Solar)", items: "220 m² • Piscina com cascata, sauna a vapor, hidro dupla e automação de som/luz por iPad.", p4h: 490, pernoite: 680, img: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=900&q=80" },
      { name: "Suíte Loft Hidro & Lareira Ecológica", items: "110 m² • Banheira de hidromassagem em pedra vulcânica, cama King e adega climatizada.", p4h: 290, pernoite: 410, img: "https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=900&q=80" }
    ];
    let per = '4h';
    window.setPeriodo = function(p) { per = p; renderSuites(); };
    function renderSuites() {
      document.getElementById('suites-grid').innerHTML = SUITES.map(s => `
        <div class="rounded-2xl overflow-hidden bg-[#140D18] border border-rose-500/25">
          <img src="${s.img}" class="w-full h-64 object-cover">
          <div class="p-6">
            <div class="flex justify-between items-start gap-3">
              <h2 class="font-serif-motel text-2xl">${s.name}</h2>
              <strong class="text-xl text-rose-400 whitespace-nowrap">R$ ${per === '4h' ? s.p4h : s.pernoite}</strong>
            </div>
            <p class="text-xs text-zinc-400 mt-2">${s.items}</p>
            <button onclick="alert('Reserva imediata garantida na ${s.name}!')" class="mt-5 w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold uppercase tracking-widest">Reservar Suíte Agora →</button>
          </div>
        </div>
      `).join('');
    }
    renderSuites();
  </script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
