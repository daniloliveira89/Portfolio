<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE GENTLEMAN'S ATELIER — Barbearia & Visagismo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #12100E; color: #F5F0EB; font-family: 'Inter', sans-serif; }
    .font-vintage { font-family: 'Cinzel', serif; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="min-h-screen antialiased">
  <header class="border-b border-amber-600/20 bg-[#12100E]/95 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <span class="font-vintage text-xl tracking-widest text-amber-500">GENTLEMAN'S ATELIER</span>
      <span class="text-xs uppercase tracking-widest text-stone-400">Corte Clássico • Navalha Quente • Bourbon Bar</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-14 grid grid-cols-1 lg:grid-cols-12 gap-10">
    <div class="lg:col-span-7">
      <span class="text-xs uppercase tracking-[0.25em] text-amber-500">Tradição & Visagismo desde 2016</span>
      <h1 class="font-vintage text-4xl sm:text-5xl mt-2 leading-tight">Monte seu ritual de cuidado masculino.</h1>
      <p class="text-stone-400 text-sm mt-3 mb-8">Selecione os serviços abaixo para calcular o tempo de cadeira e o valor do seu atendimento.</p>

      <div id="services-list" class="space-y-3"></div>
    </div>

    <!-- Resumo Interativo -->
    <div class="lg:col-span-5">
      <div class="bg-[#1C1815] border border-amber-500/30 rounded-2xl p-7 sticky top-28">
        <h2 class="font-vintage text-2xl text-amber-400 mb-4">Seu Agendamento</h2>
        <div id="selected-summary" class="space-y-2 text-sm text-stone-300 min-h-[90px]"></div>
        <div class="border-t border-white/10 mt-6 pt-4 flex justify-between items-center">
          <div>
            <span class="text-xs text-stone-400 block">Duração Estimada</span>
            <strong id="total-time" class="text-base text-white">0 min</strong>
          </div>
          <div class="text-right">
            <span class="text-xs text-stone-400 block">Valor Total</span>
            <strong id="total-price" class="text-2xl text-amber-400">R$ 0</strong>
          </div>
        </div>
        <button onclick="alert('Horário reservado no Atelier! Uma bebida cortesia espera por você.')" class="mt-6 w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs uppercase tracking-widest rounded-xl transition">
          Confirmar Reserva de Cadeira →
        </button>
      </div>
    </div>
  </main>

  <script>
    const SERVICES = [
      { id: 1, name: "Corte Visagista na Tesoura & Fade", time: 45, price: 95, checked: true },
      { id: 2, name: "Barba Real (Toalha Quente & Ozônio)", time: 30, price: 75, checked: true },
      { id: 3, name: "Selagem & Hidratação Capilar", time: 25, price: 80, checked: false },
      { id: 4, name: "Limpeza Facial Black Mask & Massagem", time: 20, price: 65, checked: false }
    ];

    function renderBarber() {
      document.getElementById("services-list").innerHTML = SERVICES.map(s => `
        <label class="flex items-center justify-between p-4 rounded-xl border ${s.checked ? 'border-amber-500 bg-amber-500/10' : 'border-white/10 bg-[#1A1614]'} cursor-pointer transition">
          <div class="flex items-center gap-3.5">
            <input type="checkbox" ${s.checked ? 'checked' : ''} onchange="toggleService(${s.id})" class="w-4 h-4 accent-amber-500">
            <div>
              <div class="font-semibold text-sm">${s.name}</div>
              <div class="text-xs text-stone-400">⏱️ ${s.time} minutos</div>
            </div>
          </div>
          <span class="font-bold text-amber-400">R$ ${s.price}</span>
        </label>
      `).join("");

      const active = SERVICES.filter(s => s.checked);
      const time = active.reduce((acc, s) => acc + s.time, 0);
      const price = active.reduce((acc, s) => acc + s.price, 0);

      document.getElementById("total-time").textContent = `${time} min`;
      document.getElementById("total-price").textContent = `R$ ${price}`;
      document.getElementById("selected-summary").innerHTML = active.length
        ? active.map(s => `<div class="flex justify-between"><span>✓ ${s.name}</span><span>R$ ${s.price}</span></div>`).join("")
        : `<p class="text-stone-500">Selecione ao menos um serviço ao lado.</p>`;
    }

    window.toggleService = function(id) {
      const item = SERVICES.find(s => s.id === id);
      if (item) item.checked = !item.checked;
      renderBarber();
    };
    renderBarber();
  </script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
