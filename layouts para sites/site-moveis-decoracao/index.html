<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATELIER NORD — Design Autoral em Madeira Maciça</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #F6F3EC; color: #231F1C; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-furniture { font-family: 'Cormorant Garamond', serif; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <header class="border-b border-stone-900/10 bg-[#F6F3EC]/90 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <span class="font-serif-furniture text-3xl tracking-widest">ATELIER NORD</span>
      <span class="text-xs uppercase tracking-widest text-amber-900 font-semibold">Marcenaria Artesanal Certificada FSC® • Desenho Brasileiro</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-14 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
    <div class="lg:col-span-7">
      <img id="chair-img" src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1000&q=80" class="w-full h-[460px] object-cover rounded-3xl shadow-lg transition duration-500" alt="Poltrona Design">
    </div>

    <!-- Personalizador de Acabamento -->
    <div class="lg:col-span-5 bg-white p-8 rounded-3xl border border-stone-200 shadow-xl">
      <span class="text-xs uppercase tracking-widest text-amber-800 font-bold">Série Assinada 2026</span>
      <h1 class="font-serif-furniture text-4xl mt-1">Poltrona Esfera Orgânica</h1>
      <p class="text-xs text-stone-500 mt-2">Encaixes japoneses sem parafusos aparentes e acabamento em cera de carnaúba.</p>

      <div class="mt-6 space-y-5">
        <div>
          <label class="text-xs font-bold uppercase text-stone-500 block mb-2">1. Madeira Maciça:</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setWood('Freijó Natural', 0)" class="py-2 px-3 rounded-xl border border-amber-800 bg-amber-50 text-xs font-semibold">Freijó</button>
            <button onclick="setWood('Nogueira Americana', 850)" class="py-2 px-3 rounded-xl border border-stone-200 text-xs font-semibold">Nogueira (+R$850)</button>
            <button onclick="setWood('Carvalho Ebonizado', 600)" class="py-2 px-3 rounded-xl border border-stone-200 text-xs font-semibold">Ebonizado (+R$600)</button>
          </div>
        </div>

        <div>
          <label class="text-xs font-bold uppercase text-stone-500 block mb-2">2. Revestimento:</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setFabric('Linho Belga Cru', 0)" class="py-2.5 px-3 rounded-xl border border-amber-800 bg-amber-50 text-xs font-semibold">Linho Belga Cru</button>
            <button onclick="setFabric('Couro Natural Sela', 1200)" class="py-2.5 px-3 rounded-xl border border-stone-200 text-xs font-semibold">Couro Sela (+R$1.200)</button>
          </div>
        </div>
      </div>

      <div class="mt-6 pt-5 border-t border-stone-200">
        <p id="config-summary" class="text-xs text-stone-500 mb-2">Configuração: Freijó Natural + Linho Belga Cru</p>
        <div class="flex justify-between items-baseline">
          <span class="text-xs uppercase text-stone-400">Valor sob encomenda</span>
          <strong id="furniture-price" class="font-serif-furniture text-4xl text-stone-900">R$ 6.490</strong>
        </div>
      </div>

      <button onclick="alert('Peça adicionada ao pedido! Nosso arquiteto enviará o bloco 3D SketchUp/Revit.')" class="mt-6 w-full py-4 rounded-xl bg-[#231F1C] hover:bg-amber-950 text-white text-xs font-bold uppercase tracking-widest transition">
        Encomendar Peça / Baixar Bloco 3D →
      </button>
    </div>
  </main>

  <script>
    let woodName = "Freijó Natural", woodAdd = 0, fabName = "Linho Belga Cru", fabAdd = 0;
    function updateChair() {
      const total = 6490 + woodAdd + fabAdd;
      document.getElementById('config-summary').textContent = `Configuração: ${woodName} + ${fabName}`;
      document.getElementById('furniture-price').textContent = 'R$ ' + total.toLocaleString('pt-BR');
    }
    window.setWood = function(n, a) { woodName = n; woodAdd = a; updateChair(); };
    window.setFabric = function(n, a) { fabName = n; fabAdd = a; updateChair(); };
  </script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
